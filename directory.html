<!doctype html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TPT Oracle Scripts Directory</title>
<style>
:root{--bg:#fff;--surface:#fafafa;--border:#e5e5e5;--hair:#f0f0f0;--text:#111;--text2:#666;--accent:#4338ca;--accent-bg:#eef2ff;--hover:#f8f8f8;--code:#fafafa;--mark:#fde68a;--overlay:rgba(15,17,21,.55);--warn:#a14a07;--warn-bg:#fff7e6;--warn-bd:#efcf93;
--sans:-apple-system,"Inter",system-ui,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
--t-kw:#8250df;--t-str:#0a3069;--t-com:#6e7781;--t-num:#0550ae;--t-bi:#953800;--t-ty:#116329}
[data-mode=dark]{--bg:#0f1115;--surface:#161920;--border:#262a33;--hair:#1c2028;--text:#e6e8ec;--text2:#8a909c;--accent:#818cf8;--accent-bg:#1d2040;--hover:#151820;--code:#161920;--mark:#5b4a12;--overlay:rgba(0,0,0,.65);--warn:#f5b84a;--warn-bg:#2b2210;--warn-bd:#5e4a1c;
--t-kw:#c4a1ff;--t-str:#a5d6ff;--t-com:#7d8590;--t-num:#79c0ff;--t-bi:#ffa657;--t-ty:#7ee787}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);min-height:100vh;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
header{display:flex;align-items:center;gap:20px;padding:12px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}.brand b{font-size:17px;letter-spacing:-.01em}.brand span{color:var(--text2);font-size:12px}
.search{flex:1;position:relative;max-width:760px}
.search input{width:100%;height:42px;padding:0 44px 0 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:15px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
kbd{font:11px var(--mono);border:1px solid var(--border);border-radius:4px;padding:1px 6px;color:var(--text2);background:var(--surface)}
.search kbd{position:absolute;right:12px;top:10px}
.icon{margin-left:auto;width:36px;height:36px;border:1px solid var(--border);border-radius:8px;background:none;cursor:pointer;font-size:16px}
.icon:hover{background:var(--hover)}
.filters{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 24px;border-bottom:1px solid var(--border);font-size:13px}
.filters label{display:flex;align-items:center;gap:6px;color:var(--text2)}
.filters select{height:30px;border:1px solid var(--border);border-radius:6px;background:var(--bg);padding:0 8px;color:var(--text)}
.filters .right{margin-left:auto;display:flex;align-items:center;gap:16px}
.count{color:var(--text2)}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text)}
.filters label.sw{color:var(--text)}
.sw input{display:none}.sw i{width:30px;height:18px;border-radius:99px;background:var(--border);position:relative;transition:.1s;flex:none}
.sw i:after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.1s}
.sw input:checked+i{background:var(--accent)}.sw input:checked+i:after{left:14px}
.layout{flex:1;display:flex;min-height:0}
aside{width:230px;flex:none;padding:14px 12px 14px 24px;border-right:1px solid var(--hair);font-size:13px}
aside h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);font-weight:600}
aside button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:5px 8px;color:var(--text2);cursor:pointer}
aside button:hover{color:var(--text)}aside button.on{border-left-color:var(--accent);color:var(--accent);background:var(--accent-bg);font-weight:600}
aside button span{font-variant-numeric:tabular-nums;opacity:.7}
main{flex:1;min-width:0}
.note{padding:10px 24px;font-size:13px;color:var(--text2);background:var(--surface);border-bottom:1px solid var(--hair)}
.row{border-bottom:1px solid var(--hair);scroll-margin-top:72px;scroll-margin-bottom:48px}
.head{display:flex;align-items:center;gap:14px;min-height:40px;padding:6px 24px;cursor:pointer}
.row:hover .head,.row.sel .head{background:var(--hover)}.row.sel .head{box-shadow:inset 2px 0 var(--accent)}
.name{font:14px var(--mono);white-space:nowrap;flex:none}.name em,.name u{font-style:normal;text-decoration:none;color:var(--text2)}.name b{font-weight:700}
.star{flex:none;font-size:11px;color:var(--accent);white-space:nowrap}
.desc{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.cat{flex:none;font-size:12px;color:var(--text2);white-space:nowrap}
.row.open .desc{white-space:normal}.detail{display:none;padding:0 24px 20px 24px;max-width:980px}
.row.open .detail{display:block}
.detail h5{margin:14px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);font-weight:600}
.code{display:flex;align-items:center;gap:10px;background:var(--code);border:1px solid var(--border);border-radius:6px;padding:7px 8px 7px 12px;font:13px var(--mono)}
.code code{flex:1;min-width:0;overflow-x:auto;white-space:pre}
.cp{flex:none;border:1px solid var(--border);background:var(--bg);border-radius:5px;padding:2px 9px;font-size:12px;cursor:pointer;color:var(--text2)}
.cp:hover{color:var(--accent);border-color:var(--accent)}
.ex{display:grid;gap:4px;grid-template-columns:minmax(0,1fr)}.layout,.row,.detail,.code{min-width:0}.detail{overflow:hidden}
.raw{margin:0;white-space:pre-wrap;word-break:break-word;font:12.5px var(--mono);color:var(--text2)}
table{border-collapse:collapse;width:100%;font-size:13px}td{padding:4px 12px 4px 0;vertical-align:top;border-bottom:1px solid var(--hair)}
td:first-child{font:12.5px var(--mono);white-space:nowrap;width:1%;color:var(--accent)}td:last-child{color:var(--text2);white-space:pre-line;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:none;border-radius:99px;padding:1px 10px;font-size:12px;color:var(--text2);cursor:pointer}
.chip.m{font-family:var(--mono)}.chip:hover{color:var(--accent);border-color:var(--accent)}
.btns{display:flex;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap}
.btn{height:32px;padding:0 14px;border-radius:6px;border:1px solid var(--border);background:var(--bg);cursor:pointer}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}[data-mode=dark] .btn.p{color:#0f1115}
.srcnote{margin-left:auto;font-size:11px;color:var(--text2)}
.empty{padding:50px 24px;color:var(--text2)}
.more{display:block;margin:16px auto 24px}
footer{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:8px 24px;font-size:12px;color:var(--text2);display:flex;gap:6px 18px;flex-wrap:wrap;z-index:15}
.fbtn{display:none}
#toast{position:fixed;left:50%;bottom:54px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:6px 14px;border-radius:6px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:1200}
#toast.on{opacity:.92}
#totop{position:fixed;right:20px;bottom:56px;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;display:none;z-index:16;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#totop.on{display:block}#totop:hover{color:var(--accent);border-color:var(--accent)}
/* view switch */
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex:none}
.seg button{height:34px;padding:0 14px;border:0;background:none;cursor:pointer;color:var(--text2);font-size:13px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--border)}
.seg button:hover{color:var(--text)}.seg button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.v-start .filters,.v-start .layout,.v-start .fbtn{display:none!important}
.v-all #start,.nowf #start,.nowf .seg{display:none}
.hint-start{display:none}.v-start .hint-start{display:contents}.v-start .hint-all{display:none}
/* requirement badges */
.reqs{display:inline-flex;flex-wrap:wrap;gap:4px;flex:none;align-items:center}
.rq{display:inline-block;font:600 10.5px/1 var(--sans);padding:3px 7px;border-radius:99px;border:1px solid var(--border);border:1px solid color-mix(in srgb,var(--accent) 38%,var(--border));color:var(--accent);white-space:nowrap;cursor:help}
.rq.chg{border-color:var(--warn-bd);color:var(--warn);background:var(--warn-bg)}
.reqlist{display:grid;gap:6px}.reqi{display:flex;gap:10px;align-items:baseline;color:var(--text2);font-size:13px}.reqi .rq{flex:none;min-width:78px;text-align:center}
.reqnone{color:var(--text2);font-size:13px}
/* start view */
#start{padding:28px 24px 40px;max-width:1500px;width:100%;margin:0 auto}
#start h1{margin:0 0 4px;font-size:24px;letter-spacing:-.015em}
#start .sub{margin:0 0 20px;color:var(--text2)}
#start .sub a{color:var(--accent);cursor:pointer}
.wfgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
@media(max-width:1199px){.wfgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:759px){.wfgrid{grid-template-columns:minmax(0,1fr)}}
.wf{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;padding:16px 18px 12px;background:var(--bg);cursor:pointer;min-width:0;scroll-margin-top:84px;outline:none;transition:border-color .1s,box-shadow .1s}
.wf:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.wf:focus-visible,.wf.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.wf.open{grid-column:1/-1;cursor:default}
.wfh{display:flex;align-items:flex-start;gap:10px}
.wfh h3{margin:0;font-size:16px;line-height:1.3;letter-spacing:-.01em;flex:1;min-width:0}
.wf.open .wfh{cursor:pointer}
.wfh .rq{flex:none;margin-top:3px}
.blurb{margin:4px 0 12px;color:var(--text2);font-size:13px}
.steps{list-style:none;margin:0;padding:0;counter-reset:st;display:grid;gap:9px}
.steps li{counter-increment:st;position:relative;padding-left:26px;min-width:0}
.steps li:before{content:counter(st);position:absolute;left:0;top:1px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text2);font-size:10.5px;line-height:16px;text-align:center;font-variant-numeric:tabular-nums}
.s1{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px}
.sn{border:0;background:none;padding:0;cursor:pointer;text-align:left;font:13px var(--mono);color:var(--text);white-space:nowrap}
.sn em,.sn u{font-style:normal;text-decoration:none;color:var(--text2)}.sn b{font-weight:700}
.sn:hover b{color:var(--accent);text-decoration:underline}
.why{color:var(--text2);font-size:12.5px;line-height:1.4;margin-top:1px}
.wf .code{margin-top:6px;max-width:940px;cursor:auto}
.wf .code code{font-size:12.5px}
.wnote{color:var(--text2);font-size:12px;margin-top:5px;max-width:940px;cursor:auto}
.wftoggle{margin-top:auto;padding-top:12px;font-size:12px;color:var(--accent)}
.wf.open .steps{gap:14px;margin-top:2px}.wf.open .why{font-size:13px}
/* source viewer */
.code-overlay{position:fixed;inset:0;z-index:1000;background:var(--overlay);display:none;padding:28px 40px}
.code-overlay.open{display:flex}
.code-panel{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.code-header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.code-title{font:13px var(--mono);font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code-line-count{font-size:12px;color:var(--text2);white-space:nowrap}
.code-copy-btn,.code-close-btn{height:28px;border:1px solid var(--border);background:var(--bg);border-radius:6px;cursor:pointer;padding:0 12px;color:var(--text2)}
.code-close-btn{width:28px;padding:0;font-size:18px;line-height:1}
.code-copy-btn:hover,.code-close-btn:hover{color:var(--accent);border-color:var(--accent)}
.code-body{flex:1;overflow:auto;background:var(--code)}
.code-body pre{margin:0}.code-body code{display:block;font:13px/1.65 var(--mono);padding:14px 0;tab-size:4;color:var(--text)}
.hljs-ln{border-collapse:collapse}.hljs-ln td{padding:0 16px 0 0;white-space:pre}
.hljs-ln td.n{color:var(--text2);opacity:.55;text-align:right;padding:0 14px 0 16px;user-select:none;min-width:52px;vertical-align:top;font-size:inherit}
.hljs-keyword,.hljs-literal,.hljs-selector-tag{color:var(--t-kw)}
.hljs-string,.hljs-title,.hljs-name,.hljs-meta .hljs-string{color:var(--t-str)}
.hljs-comment,.hljs-quote{color:var(--t-com);font-style:italic}
.hljs-number,.hljs-symbol{color:var(--t-num)}
.hljs-built_in,.hljs-variable,.hljs-template-variable,.hljs-meta{color:var(--t-bi)}
.hljs-type,.hljs-attr,.hljs-attribute{color:var(--t-ty)}
.code-loading,.code-error{padding:40px;color:var(--text2)}
@media(max-width:800px){aside{display:none}header,.filters,.head,.detail,footer,.note{padding-left:14px;padding-right:14px}
 .fbtn{display:block;margin-left:auto}.icon{margin-left:0}.filters{display:none}.filters.show{display:flex}.filters .right{margin-left:0;width:100%;justify-content:space-between}
 .code-overlay{padding:10px}#start{padding:20px 14px 32px}}
@media(max-width:600px){
 header{flex-wrap:wrap;gap:8px 8px}.brand span{display:none}.search{order:3;flex-basis:100%;max-width:none}.search kbd{display:none}
 .head{flex-wrap:wrap;gap:2px 10px}.desc{flex-basis:100%;order:3}.cat{display:none}.name{white-space:normal;word-break:break-all}.head .reqs{order:2;flex-basis:100%;margin:2px 0 3px}.seg button{padding:0 8px;height:32px;font-size:12px}.brand b{font-size:15px}.fbtn{padding:0 10px}.icon{width:34px;height:34px}#start h1{font-size:21px}.wf{padding:14px 14px 10px}.sn{white-space:normal;word-break:break-all}.reqi{flex-wrap:wrap}
 footer{display:none}#totop{bottom:16px}.srcnote{margin-left:0;flex-basis:100%}.row{scroll-margin-top:124px}.code code{white-space:pre-wrap;word-break:break-all}
}
</style>
</head>
<body class="v-all">
<header>
  <div class="brand"><b>TPT Scripts</b><span>Tanel Poder's Oracle troubleshooting scripts</span></div>
  <div class="seg" id="seg" role="group" aria-label="View"><button id="v-start" data-view="start" aria-pressed="false">Start here</button><button id="v-all" data-view="all" aria-pressed="true">All scripts</button></div>
  <div class="search"><input id="q" placeholder="Search scripts… e.g. ashtop, lock, explain plan" autocomplete="off" spellcheck="false" aria-label="Search scripts"><kbd>/</kbd></div>
  <button class="btn fbtn" id="fb" aria-expanded="false">Filters</button>
  <button class="icon" id="mode" title="Toggle dark mode" aria-label="Toggle dark mode">&#9680;</button>
</header>
<div class="filters" id="filters">
  <label>Category <select id="cat"></select></label>
  <label>Kind <select id="kind">
    <option value="tool">Tools</option><option value="wrapper">Wrappers</option><option value="demo">Demos</option><option value="setup">Setup &amp; fragments</option><option value="all">All kinds</option></select></label>
  <label>Needs <select id="req"><option value="any">Anything</option><option value="nopacks">No license packs</option><option value="nosys">No SYS access</option><option value="readonly">Read-only</option><option value="none">None of these</option></select></label>
  <label>Sort <select id="sort"><option value="rel">Relevance</option><option value="az">A&ndash;Z</option><option value="cat">Category</option></select></label>
  <label class="sw"><input type="checkbox" id="doc"><i></i>Hand-documented only</label>
  <div class="right"><span class="count" id="count"></span><label class="sw"><input type="checkbox" id="inc"><i></i>Include demos &amp; setup</label></div>
</div>
<section id="start" aria-label="Start here"><h1>What are you troubleshooting?</h1><p class="sub">Pick a situation for a short sequence of scripts to run, in order. Or search above, or <a data-view="all">browse all scripts</a>.</p><div class="wfgrid" id="wfgrid"></div></section>
<div class="layout"><aside><h4>Categories</h4><div id="side"></div></aside><main id="main"><div id="note"></div><div id="list"></div><div id="moreWrap"></div></main></div>
<footer><span><kbd>/</kbd> search</span><span><kbd>&uarr;&darr;</kbd> move</span><span><kbd>Enter</kbd> expand</span><span class="hint-all"><kbd>c</kbd> copy syntax</span><span class="hint-all"><kbd>o</kbd> source</span><span><kbd>Esc</kbd> <span class="hint-all">close</span><span class="hint-start">collapse</span></span></footer>
<button id="totop" title="Scroll to top" aria-label="Scroll to top">&uarr;</button>
<div id="toast"></div>

<div class="code-overlay" id="code-overlay">
  <div class="code-panel">
    <div class="code-header">
      <span class="code-title" id="code-title"></span>
      <span class="code-line-count" id="code-line-count"></span>
      <button class="code-copy-btn" id="code-copy-btn">Copy</button>
      <button class="code-close-btn" id="code-close-btn" aria-label="Close">&times;</button>
    </div>
    <div class="code-body" id="code-body"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const DATA = SCRIPTS_DATA;
const PAGE = 150;
const st = {q:'', cat:'', kind:'tool', sort:'rel', doc:false, req:'any', open:null, cur:0, shown:PAGE, view:'all', wf:null, wcur:-1, cbAll:null};
const WF = (typeof WORKFLOWS !== 'undefined' && Array.isArray(WORKFLOWS)) ? WORKFLOWS : [];
const REQS = ['any', 'nopacks', 'nosys', 'readonly', 'none'];
const REQ_EXCL = {nopacks: ['diag_pack', 'tuning_pack'], nosys: ['x$', 'sysdba'], readonly: ['changes']};
const RQ = {
  diag_pack: {label: 'Diag Pack', tip: 'Uses ASH/AWR (V$ACTIVE_SESSION_HISTORY, DBA_HIST_*): requires Oracle Diagnostics Pack license'},
  tuning_pack: {label: 'Tuning Pack', tip: 'Uses SQL Monitor / DBMS_SQLTUNE: requires Oracle Tuning Pack license'},
  'x$': {label: 'X$', tip: "Reads X$ fixed tables: run as SYS or install TPT's X$ views (setup/create_xviews.sql)"},
  sysdba: {label: 'SYSDBA', tip: 'Uses ORADEBUG: requires SYSDBA'},
  changes: {label: 'Changes DB', tip: 'Modifies database/instance state (DDL, DML, ALTER SYSTEM, plan baselines, stats\u2026)'}
};
const RQ_ORDER = ['diag_pack', 'tuning_pack', 'x$', 'sysdba', 'changes'];
let L = [];            // current filtered result list (records)
let fuzzy = false;     // true when showing loose matches
const rowMap = new Map();
const fileMap = new Map(DATA.map(r => [r.file, r]));

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const base = r => r.name.replace(/\.sql$/i, '');
const isTool = r => r.kind === 'tool';
const SETUP_KINDS = ['setup', 'stub', 'fragment'];

// ---------- precompute lowercase search fields ----------
DATA.forEach(r => {
  r._b = base(r).toLowerCase();
  r._f = r.file.toLowerCase().replace(/\.sql$/, '');
  r._p = (r.purpose || '').toLowerCase();
  r._k = (r.keywords || '').toLowerCase();
  r._kt = r._k.split(/\s*,\s*/);
  r._c = (r.category || '').toLowerCase();
  r._s = (r.syntax || '').toLowerCase();
  r._d = (r.directory || '').toLowerCase();
});

// ---------- search ----------
function parseQuery(q) {
  return q.toLowerCase().split(/\s+/).map(t => t.replace(/\.sql$/, '')).filter(Boolean).map(t => ({
    t,
    pre: new RegExp('(^|[^a-z0-9])' + escRe(t)),
    word: new RegExp('(^|[^a-z0-9])' + escRe(t) + '($|[^a-z0-9])')
  }));
}
function termScore(r, T) {
  const t = T.t;
  if (t.includes('/')) {
    if (r._f === t) return 1000;
    if (r._f.startsWith(t)) return 600;
    if (r._f.includes(t)) return 400;
    return -1;
  }
  if (r._b === t) return 1000;
  if (r._b.startsWith(t)) return 600 - Math.min(r._b.length, 60) / 10;
  if (r._b.includes(t)) return 400 - Math.min(r._b.length, 60) / 10;
  if (t.length < 3) {
    if (r._kt.includes(t)) return 150;
    if (T.word.test(r._p)) return 100;
    if (T.word.test(r._s)) return 60;
  } else {
    if (r._kt.includes(t)) return 150;
    if (r._kt.some(k => k.startsWith(t) || T.pre.test(k))) return 120;
    if (T.pre.test(r._p)) return 100;

// ---------- URL ----------
function syncUrl() {

  if (st.sort !== 'rel') p.set('sort', st.sort);
  if (st.doc) p.set('doc', '1');
  if (st.req !== 'any') p.set('req', st.req);
  if (st.open) p.set('open', st.open);
  const dflt = p.toString() ? 'all' : 'start';   // what a reload would pick without an explicit view
  if (st.view === 'start' && st.wf) p.set('wf', st.wf);

$('#cat').onchange = e => { st.cat = e.target.value; render(); };
$('#req').onchange = e => { st.req = e.target.value; render(); };
$('#sort').onchange = e => { st.sort = e.target.value; render(); };
$('#kind').onchange = e => { st.kind = e.target.value; render(); };
$('#doc').onchange = e => { st.doc = e.target.checked; render(); };
$('#inc').onchange = e => { st.kind = e.target.checked ? 'all' : 'tool'; render(); };
$('#fb').onclick = () => { const f = $('#filters'); f.classList.toggle('show'); $('#fb').setAttribute('aria-expanded', f.classList.contains('show')); };

function applyMode(m, persist) {
  document.documentElement.dataset.mode = m;
  if (persist) try { localStorage.setItem('tpt-mode', m); } catch (e) {}
}
$('#mode').onclick = () => applyMode(document.documentElement.dataset.mode === 'dark' ? 'light' : 'dark', true);

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const inp = document.activeElement === $('#q');
  const typing = inp || /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName || '');
  if (e.key === 'Escape') {
    if (viewerOpen()) closeCodeViewer();
    else if (st.view === 'start') { if (st.wf) setWf(null); else if (inp) $('#q').blur(); }
    else if (st.open) setOpen(null);
    else if (st.q || $('#q').value) { clearTimeout(debounce); $('#q').value = ''; st.q = ''; st.cur = 0; render(); }
    else if (inp) $('#q').blur();
    return;
  }
  if (viewerOpen()) return;
  if (e.key === '/' && !typing) { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if (st.view === 'start') {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || (!typing && (e.key === 'j' || e.key === 'k'))) {
      if (document.activeElement?.tagName === 'SELECT') return;
      e.preventDefault();
      setWfCursor(st.wcur < 0 && (e.key === 'ArrowUp' || e.key === 'k') ? 0 : st.wcur + (e.key === 'ArrowDown' || e.key === 'j' ? 1 : -1), true);
    } else if (e.key === 'Enter' && !typing && !e.target.closest?.('button,a') && st.wcur >= 0) {
      e.preventDefault(); setWf(st.wf === WF[st.wcur].id ? null : WF[st.wcur].id, true);
    }
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || (!typing && (e.key === 'j' || e.key === 'k'))) {
    if (document.activeElement?.tagName === 'SELECT') return;
    e.preventDefault();
    if (inp) { clearTimeout(debounce); if ($('#q').value.trim() !== st.q) { st.q = $('#q').value.trim(); st.open = null; st.cur = 0; render(); } }
    setCursor(st.cur + (e.key === 'ArrowDown' || e.key === 'j' ? 1 : -1), true);
    return;
  }
  if (e.key === 'Enter' && (inp || !typing) && !e.target.closest?.('button,a')) {
    if (inp) { clearTimeout(debounce); if ($('#q').value.trim() !== st.q) { st.q = $('#q').value.trim(); st.open = null; st.cur = 0; render(); } }
    if (L[st.cur]) { e.preventDefault(); toggleRow(L[st.cur].file); rowMap.get(L[st.cur].file)?.scrollIntoView({block: 'nearest'}); }
    return;
  }
  if (typing) return;
  if (e.key === 'c') { const r = curRec(); if (r && r.syntax) copyText(r.syntax).then(() => toast('Copied syntax: ' + r.syntax)); }
  else if (e.key === 'o') { const r = curRec(); if (r) openCodeViewer(r.file); }
});

// scroll: incremental loading + to-top
const totop = $('#totop');
addEventListener('scroll', () => {
  totop.classList.toggle('on', scrollY > 600);
  if (st.view === 'all' && st.shown < L.length && innerHeight + scrollY > document.documentElement.scrollHeight - 900) { st.shown += PAGE; renderList(); }
}, {passive: true});
totop.onclick = () => scrollTo({top: 0, behavior: 'smooth'});

// ---------- init ----------
(function init() {
  const cats = [...new Set(DATA.map(r => r.category))].sort();
  $('#cat').innerHTML = '<option value="">All categories</option>' + cats.map(x => `<option>${esc(x)}</option>`).join('');
  let m = null;
  try { m = localStorage.getItem('tpt-mode'); } catch (e) {}
  if (m !== 'dark' && m !== 'light') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  applyMode(m, false);
  const um = new URLSearchParams(location.search).get('mode');   // optional ?mode=dark|light override (not persisted)
  if (um === 'dark' || um === 'light') applyMode(um, false);
  if (!WF.length) document.body.classList.add('nowf');
  readUrl();
  $('#q').value = st.q;
  if (st.wf) st.wcur = WF.findIndex(w => w.id === st.wf);
  setView(st.view, true);
  if (st.view === 'all') { render(); if (st.open) rowMap.get(st.open)?.scrollIntoView({block: 'nearest'}); }
  else { renderStart(); syncUrl(); if (st.wf) wfCard(st.wcur)?.scrollIntoView({block: 'start'}); }
})();
</script>
</body>
</html>
